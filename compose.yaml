services:

  app:
    build: .
    image: ${DOCKER_IMAGE:-gestion-salle-universitaire}:${IMAGE_TAG:-latest}
    container_name: gestion_universitaire_app
    ports:
      - "8081:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-gestion_universitaire}
      DB_USERNAME: ${DB_USERNAME:-gestion_user}
      DB_PASSWORD: ${DB_PASSWORD:-gestion_password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: gestion_universitaire_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestion_universitaire}
      MYSQL_USER: ${MYSQL_USER:-gestion_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gestion_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: gestion_universitaire_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
