services:

  app:
    build: .
    image: ${DOCKER_IMAGE:-gestion-salle-universitaire}:${IMAGE_TAG:-latest}
    container_name: gestion_universitaire_app
    ports:
      - "8081:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: gestion_universitaire_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_universitaire
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
